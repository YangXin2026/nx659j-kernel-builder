name: 4.19-kona-ksu-a16fix-oc

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "0=baseline / 1=SukiSU"
        required: true
        default: "0"
      minimal:
        description: "1=minimal（不带 nx659j/COMPAT）"
        required: false
        default: "0"
      stock:
        description: "1=使用原厂 stock-linux.config"
        required: false
        default: "0"
      localversion:
        description: "内核 localversion"
        required: false
        default: "kona-ksu-a16fix-oc"
      ksu_tag:
        description: "KernelSU/SukiSU tag（phase=1 时生效）"
        required: false
        default: "v4.3.0"
      ksu_repo:
        description: "KernelSU/SukiSU 仓库"
        required: false
        default: "SukiSU-Ultra/SukiSU-Ultra"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_nubia_sm8250
      KERNEL_BRANCH: lineage-23.2
      CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      LOCALVERSION: ${{ inputs.localversion }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi
          sudo apt-get install -y bc bison build-essential ccache flex git libssl-dev libelf-dev python3 rsync zip unzip cpio device-tree-compiler

      - name: Clone kernel (shallow)
        run: git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Fetch AOSP clang r416183b
        run: |
          git clone --depth 1 "$CLANG_REPO" clang
          clang/bin/clang --version | head -1

      - name: Prepare kernel patches
        run: bash scripts/prepare-kernel.sh kernel

      - name: KernelSU / SukiSU (Phase 1 only)
        if: ${{ inputs.phase == '1' }}
        env:
          KSU_TAG: ${{ inputs.ksu_tag }}
          REPO: ${{ inputs.ksu_repo }}
        run: bash scripts/apply-kernelsu.sh kernel

      - name: Configure
        run: |
          MINIMAL=${{ inputs.minimal }} STOCK=${{ inputs.stock }} PHASE=${{ inputs.phase }} KERNEL_DIR=kernel CLANG_DIR=clang LOCALVERSION="$LOCALVERSION" bash scripts/build.sh configure

      - name: Build Image.gz
        run: |
          set -o pipefail
          MINIMAL=${{ inputs.minimal }} STOCK=${{ inputs.stock }} PHASE=${{ inputs.phase }} KERNEL_DIR=kernel CLANG_DIR=clang LOCALVERSION="$LOCALVERSION" bash scripts/build.sh build 2>&1 | tee build.log

      - name: Collect dtb artifacts
        run: |
          mkdir -p dtb-out
          find out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' 2>/dev/null | while read f; do
            cp "$f" dtb-out/ || true
          done
          ls -la dtb-out/ || true
          # 也把 dtbo.img 复制出来（如果生成了）
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img dtb-out/ || true

      - name: Checksums
        run: bash scripts/build.sh checksums

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4.19-kona-ksu-a16fix-oc-phase${{ inputs.phase }}
          path: |
            out/arch/arm64/boot/Image.gz
                        out/System.map
            out/.config
            build.log
            sha256sums.txt
            dtb-out/
          if-no-files-found: warn
          include-hidden-files: true

