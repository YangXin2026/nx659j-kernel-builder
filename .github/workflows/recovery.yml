name: OrangeFox Recovery - NX659J

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Cleanup runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Build environment
        run: |
          sudo apt update
          sudo apt install -y aria2 python3 python-is-python3
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master ofox-scripts
          cd ofox-scripts
          sudo bash setup/android_build_env.sh || true

      - name: Sync OrangeFox 12.1
        run: |
          set -x
          git clone https://gitlab.com/OrangeFox/sync.git -b master sync
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Clone device tree
        run: |
          set -x
          cd "$GITHUB_WORKSPACE/fox_12.1"
          mkdir -p device/nubia
          git clone https://github.com/DrBrown28/PBRP-NX659J-12.1 -b 12.1 device/nubia/NX659J
          ls -la device/nubia/NX659J | head

      - name: Generate OrangeFox product
        run: |
          set -x
          cd "$GITHUB_WORKSPACE/fox_12.1"
          D=device/nubia/NX659J
          cat > /tmp/fox_NX659J.mk <<'EOF'
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_base.mk)
          $(call inherit-product-if-exists, vendor/recovery/config/common.mk)
          $(call inherit-product-if-exists, vendor/fox/config/common.mk)
          $(call inherit-product-if-exists, vendor/omni/config/common.mk)
          $(call inherit-product-if-exists, vendor/twrp/config/common.mk)
          $(call inherit-product, device/nubia/NX659J/device.mk)

          PRODUCT_NAME := fox_NX659J
          PRODUCT_DEVICE := NX659J
          PRODUCT_RELEASE_NAME := NX659J
          PRODUCT_BRAND := nubia
          PRODUCT_MODEL := NX659J
          PRODUCT_MANUFACTURER := nubia
          FOX_BUILD_DEVICE := NX659J
          EOF
          sed 's/^          //' /tmp/fox_NX659J.mk > $D/fox_NX659J.mk
          cat > $D/AndroidProducts.mk <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/fox_NX659J.mk

          COMMON_LUNCH_CHOICES := fox_NX659J-eng
          EOF
          sed -i 's/^          //' $D/AndroidProducts.mk
          cat $D/AndroidProducts.mk

      - name: Fix magisk prebuilt security path
        run: |
          set -x
          cd "$GITHUB_WORKSPACE/fox_12.1"
          sudo mkdir -p /security
          for f in vendor/recovery/security/*.x509.pem build/make/target/product/security/*.x509.pem; do
            [ -f "$f" ] && sudo cp -n "$f" /security/ || true
          done
          for k in magisk miui_releasekey releasekey testkey; do
            [ -f "/security/$k.x509.pem" ] || sudo cp /security/testkey.x509.pem "/security/$k.x509.pem" 2>/dev/null || true
          done
          ls -l /security | head -20
      - name: Build OrangeFox
        run: |
          set -x
          cd "$GITHUB_WORKSPACE/fox_12.1"
          set +e
          source build/envsetup.sh
          set -e
          set -o pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch fox_NX659J-eng
          mka adbd recoveryimage 2>&1 | tee build-recovery.log

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-NX659J
          path: |
            fox_12.1/out/target/product/NX659J/*.img
            fox_12.1/out/target/product/NX659J/*.zip
            fox_12.1/build-recovery.log
          if-no-files-found: warn